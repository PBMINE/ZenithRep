source = colors.conf

$font = SF Pro Display
$icon_font = Inter Nerd Font Propo

general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
    fractional_scaling = 2
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
}

animations {
    enabled = true
    bezier = easeInOutSine, 0.37, 0, 0.63, 1
    bezier = easeOut, 0, 0, 0.2, 1
    animation = fadeIn, 1, 3, easeInOutSine
    animation = fadeOut, 1, 3, easeInOutSine
    animation = inputFieldDots, 1, 3, easeOut
}

background {
    monitor =
    path = $image
    color = $background
    blur_passes = 0
}

# STATUS BAR
# User
label {
    monitor =
    text = 󰀉   $USER
    color = rgba(255, 255, 255, 0.8)
    font_size = 14
    font_family = $icon_font
    position = 30, -36
    halign = left
    valign = top
}

# Battery
label {
    monitor =
    text = cmd[update:1000] echo "$(cat /sys/class/power_supply/BAT0/capacity)%   󰁹 "
    color = rgba(255, 255, 255, 0.8)
    font_size = 14
    font_family = $icon_font
    position = -30, -36
    halign = right
    valign = top
}

# TIME (Stacked - Google Pixel style)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgb(255, 255, 255)
    font_size = 200
    font_family = $font Bold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = $primary
    font_size = 200
    font_family = $font Bold
    position = 0, -60
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] date +"%A, %d %B"
    color = rgba(255, 255, 255, 0.8)
    font_size = 22
    font_family = $font Semibold
    position = 0, -220
    halign = center
    valign = center
}

# INPUT FIELD (Pixel Pill Design)
input-field {
    monitor =
    size = 280, 60
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $on_surface
    fade_on_empty = true
    placeholder_text = Password
    hide_input = false
    rounding = -1
    check_color = $primary
    fail_color = $error
    position = 0, 120
    halign = center
    valign = bottom
}
